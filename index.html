<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedigree Code Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #f43f5e;
      --editor-bg: #1e1e2e;
      --editor-text: #cdd6f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(to right, #0f172a, #334155);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
    }

    select, button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    select:hover, button:hover {
      border-color: #cbd5e1;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .editor-pane {
      width: 40%;
      min-width: 350px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background-color: var(--editor-bg);
    }

    .pane-header {
      background-color: #11111b;
      padding: 0.75rem 1.5rem;
      color: #a6adc8;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #313244;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      flex: 1;
      width: 100%;
      border: none;
      background-color: var(--editor-bg);
      color: var(--editor-text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      padding: 1.5rem;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #f8fafc;
      overflow: hidden;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: auto;
    }

    .preview-card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 8px -1px rgba(0, 0, 0, 0.03);
      padding: 2rem;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 500px;
      min-height: 350px;
    }

    .error-banner {
      background-color: #fef2f2;
      border-top: 1px solid #fee2e2;
      padding: 0.75rem 1.5rem;
      color: #991b1b;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">P</div>
      <div>
        <h1>Pedigree Code</h1>
        <div class="subtitle">Clinical family tree diagrams via clean code</div>
      </div>
    </div>

    <div class="controls">
      <select id="templateSelect">
        <option value="simple">Simple Family (3 Generations)</option>
        <option value="consanguineous">Consanguineous Marriage & Twins</option>
        <option value="complex">Complex Pedigree with Index & Deceased</option>
        <option value="childless">Childless & Infertility Markers</option>
      </select>
      <button id="renderBtn" class="btn-primary">Render Diagram</button>
    </div>
  </header>

  <main>
    <div class="editor-pane">
      <div class="pane-header">
        <span>DSL Input Code</span>
        <span style="color: #6c7086;">Lines starting with % are comments</span>
      </div>
      <textarea id="editor" spellcheck="false">% Write your pedigree code here
</textarea>
      <div id="errorBanner" class="error-banner"></div>
    </div>

    <div class="preview-pane">
      <div class="pane-header" style="background-color: #f1f5f9; color: #475569; border-bottom: 1px solid var(--border-color);">
        <span>Visual Render</span>
      </div>
      <div class="preview-container">
        <div class="preview-card" id="svgContainer"></div>
      </div>
    </div>
  </main>

  <script>
    // Embedded core library inside index.html for instant client execution
    const theme = {
      ink: "#111827",
      surface: "#ffffff",
      text: "#1f2937",
    };

    const SYMBOL_PX = 24;
    const ROW_HEIGHT_PX = 90;
    const NODE_GAP_PX = 60;
    const MARGIN_X = 60;
    const MARGIN_Y = 40;

    function parseDSL(dsl) {
      const individuals = new Map();
      const relationships = [];
      const legends = [];

      const lines = dsl.split(/\n/).map(l => l.trim());

      for (let lineNum = 1; lineNum <= lines.length; lineNum++) {
        const line = lines[lineNum - 1];
        if (!line || line.startsWith("%") || line.startsWith("#")) {
          continue;
        }

        if (line.startsWith("!")) {
          const parts = line.slice(1).trim().split(/\s+/);
          const status = parts[0];
          const description = parts.slice(1).join(" ");
          if (!status || !description) throw new Error(`Invalid legend on line ${lineNum}`);
          legends.push({ status, description });
          continue;
        }

        if (line.startsWith("~")) {
          const content = line.slice(1).trim();
          const parts = content.split(">");
          const left = parts[0].trim();
          const right = parts[1] ? parts[1].trim() : "";

          const opMatch = left.match(/([-=\/|])/);
          if (!opMatch) throw new Error(`Invalid relationship format on line ${lineNum}`);
          const op = opMatch[1];
          const opIndex = left.indexOf(op);
          const parent1 = left.slice(0, opIndex).trim();
          const parent2 = left.slice(opIndex + 1).trim();

          let isChildless = false;
          let isInfertile = false;
          let children = [];

          if (parts.length > 1) {
            if (right === "" || right === "choice") {
              isChildless = true;
            } else if (right === "*") {
              isChildless = true;
              isInfertile = true;
            } else {
              children = parseChildrenExpression(right);
            }
          }

          relationships.push({ parent1, parent2, op, children, isChildless, isInfertile });
          continue;
        }

        let parsedLine = line;
        let label = undefined;
        const labelMatch = line.match(/\[label:([^\]]+)\]/);
        if (labelMatch) {
          label = labelMatch[1];
          parsedLine = line.replace(labelMatch[0], "").trim();
        }

        const tokens = parsedLine.split(/\s+/);
        const id = tokens[0];
        const sex = tokens[1];
        const status = tokens[2];

        if (!id || !["M", "F", "U", "A"].includes(sex) || !["Af", "UAf", "Ca", "XCa", "Unk"].includes(status)) {
          throw new Error(`Invalid individual definition on line ${lineNum}: ${line}`);
        }

        const ind = { id, sex, status };
        if (label) {
          ind.label = label;
        }
        for (let i = 3; i < tokens.length; i++) {
          const attr = tokens[i];
          if (/^\d/.test(attr)) {
            ind.age = attr;
          } else if (attr === "index" || attr === "proband") {
            ind.isIndex = true;
          } else if (attr === "dead") {
            ind.isDeceased = true;
          } else if (attr === "adopted-in") {
            ind.adopted = "in";
          } else if (attr === "adopted-out") {
            ind.adopted = "out";
          } else if (attr === "preg") {
            ind.isPreg = true;
          } else if (attr === "misc") {
            ind.isMisc = true;
          } else if (attr === "induced") {
            ind.isInduced = true;
          } else if (attr === "sb") {
            ind.isSb = true;
          }
        }
        individuals.set(id, ind);
      }

      return { individuals, relationships, legends };
    }

    function parseChildrenExpression(expr) {
      const result = [];
      let currentToken = "";
      let bracketDepth = 0;

      for (let i = 0; i < expr.length; i++) {
        const char = expr[i];
        if (char === "[") {
          bracketDepth++;
          currentToken += char;
        } else if (char === "]") {
          bracketDepth--;
          currentToken += char;
        } else if (char === "," && bracketDepth === 0) {
          if (currentToken.trim()) result.push(parseChildToken(currentToken.trim()));
          currentToken = "";
        } else {
          currentToken += char;
        }
      }
      if (currentToken.trim()) result.push(parseChildToken(currentToken.trim()));
      return result;
    }

    function parseChildToken(token) {
      if (token.startsWith("[[") && token.endsWith("]]")) {
        const names = token.slice(2, -2).split(",").map(n => n.trim()).filter(Boolean);
        return { type: "dizygotic", children: names };
      } else if (token.startsWith("[") && token.endsWith("]")) {
        const names = token.slice(1, -1).split(",").map(n => n.trim()).filter(Boolean);
        return { type: "monozygotic", children: names };
      } else {
        return { type: "single", name: token };
      }
    }

    function layoutDiagram(diagram) {
      const nodes = [];
      const parentRelMap = new Map();
      for (const rel of diagram.relationships) {
        for (const group of rel.children) {
          if (group.type === "single") {
            parentRelMap.set(group.name, rel);
          } else {
            for (const name of group.children) {
              parentRelMap.set(name, rel);
            }
          }
        }
      }

      const genMemo = new Map();
      function getGen(id) {
        if (genMemo.has(id)) return genMemo.get(id);
        const rel = parentRelMap.get(id);
        if (!rel) {
          genMemo.set(id, 0);
          return 0;
        }
        const g = 1 + Math.max(getGen(rel.parent1), getGen(rel.parent2));
        genMemo.set(id, g);
        return g;
      }

      const row = new Map();
      for (const id of diagram.individuals.keys()) {
        row.set(id, getGen(id));
      }

      for (const rel of diagram.relationships) {
        const r1 = row.get(rel.parent1) ?? 0;
        const r2 = row.get(rel.parent2) ?? 0;
        const maxR = Math.max(r1, r2);
        row.set(rel.parent1, maxR);
        row.set(rel.parent2, maxR);
      }

      const coupleByPartner = new Map();
      for (const rel of diagram.relationships) {
        coupleByPartner.set(rel.parent1, rel);
        coupleByPartner.set(rel.parent2, rel);
      }

      const x = new Map();
      let cursor = MARGIN_X;
      const slot = () => {
        const at = cursor;
        cursor += SYMBOL_PX + NODE_GAP_PX;
        return at;
      };

      const placed = new Set();
      function placeNode(id) {
        if (x.has(id)) return x.get(id);
        placed.add(id);
        const rel = coupleByPartner.get(id);
        if (rel) return placeRelationship(rel);
        const at = slot();
        x.set(id, at);
        return at;
      }

      function placeRelationship(rel) {
        const key = [rel.parent1, rel.parent2].sort().join("-");
        if (x.has(key)) return x.get(key);
        x.set(key, MARGIN_X);

        const kidsList = [];
        for (const group of rel.children) {
          if (group.type === "single") kidsList.push(group.name);
          else kidsList.push(...group.children);
        }

        const kidXs = kidsList.map(placeNode);
        const half = (SYMBOL_PX + NODE_GAP_PX) / 2;
        let mid;

        if (kidXs.length > 0) {
          mid = (Math.min(...kidXs) + Math.max(...kidXs)) / 2;
          x.set(rel.parent1, mid - half);
          x.set(rel.parent2, mid + half);
        } else {
          const p1x = slot();
          const p2x = slot();
          x.set(rel.parent1, p1x);
          x.set(rel.parent2, p2x);
          mid = (p1x + p2x) / 2;
        }
        x.set(key, mid);
        return mid;
      }

      for (const rel of diagram.relationships) placeRelationship(rel);
      for (const id of diagram.individuals.keys()) {
        if (!placed.has(id)) placeNode(id);
      }

      const nodeXs = Array.from(diagram.individuals.keys()).map(id => x.get(id) ?? MARGIN_X);
      const minX = nodeXs.length > 0 ? Math.min(...nodeXs) : MARGIN_X;
      const maxX = nodeXs.length > 0 ? Math.max(...nodeXs) + SYMBOL_PX : MARGIN_X + SYMBOL_PX;
      const contentWidth = maxX - minX;
      const canvasWidth = Math.max(800, contentWidth + MARGIN_X * 2);
      const offsetX = (canvasWidth - contentWidth) / 2 - minX;

      for (const id of diagram.individuals.keys()) {
        x.set(id, (x.get(id) ?? MARGIN_X) + offsetX);
      }

      const maxLinesInRow = new Map();
      for (const [id, ind] of diagram.individuals) {
        const r = row.get(id) ?? 0;
        const labelLines = ind.label ? ind.label.split("|").length : 0;
        const ageLine = ind.age ? 1 : 0;
        const totalLines = labelLines + ageLine;
        maxLinesInRow.set(r, Math.max(maxLinesInRow.get(r) ?? 0, totalLines));
      }

      const maxRow = Array.from(row.values()).reduce((max, r) => Math.max(max, r), 0);
      const rowY = new Map();
      rowY.set(0, MARGIN_Y);
      for (let r = 0; r < maxRow; r++) {
        const lines = maxLinesInRow.get(r) ?? 0;
        const h = Math.max(90, SYMBOL_PX + lines * 11 + 45);
        rowY.set(r + 1, rowY.get(r) + h);
      }

      const pos = new Map();
      for (const [id, ind] of diagram.individuals) {
        pos.set(id, {
          x: x.get(id) ?? MARGIN_X,
          y: rowY.get(row.get(id) ?? 0) ?? MARGIN_Y
        });
      }

      function renderSymbol(ind, px, py) {
        const affected = ind.status === "Af";
        const carrier = ind.status === "Ca";
        const xlinked = ind.status === "XCa";
        const unknownStatus = ind.status === "Unk";
        const baseFill = affected ? theme.ink : theme.surface;
        const strokeColor = theme.ink;
        const r = SYMBOL_PX / 2;

        const children = [];

        if (ind.isMisc || ind.isInduced) {
          children.push({
            type: "path",
            d: `M ${px + r} ${py + 4} L ${px + SYMBOL_PX - 4} ${py + 20} L ${px + 4} ${py + 20} Z`,
            fill: baseFill,
            stroke: strokeColor
          });
          if (ind.isInduced) {
            children.push({ type: "line", x1: px + SYMBOL_PX - 2, y1: py + 2, x2: px + 2, y2: py + 22 });
          }
        } else if (ind.isPreg || ind.sex === "U" || ind.sex === "A") {
          children.push({
            type: "path",
            d: `M ${px + r} ${py} L ${px + SYMBOL_PX} ${py + r} L ${px + r} ${py + SYMBOL_PX} L ${px} ${py + r} Z`,
            fill: baseFill,
            stroke: strokeColor
          });
          if (ind.sex === "A") {
            children.push({ type: "text", x: px + r, y: py + r + 3, text: "?", anchor: "middle", fontSize: 10 });
          } else if (ind.isPreg) {
            children.push({ type: "text", x: px + r, y: py + r + 3, text: "P", anchor: "middle", fontSize: 9, color: affected ? theme.surface : theme.text });
          }
        } else if (ind.sex === "M") {
          children.push({ type: "rect", x: px, y: py, width: SYMBOL_PX, height: SYMBOL_PX, fill: baseFill, stroke: strokeColor });
        } else {
          children.push({ type: "circle", cx: px + r, cy: py + r, r: r, fill: baseFill, stroke: strokeColor });
        }

        if (carrier && !affected) {
          if (ind.sex === "M") {
            children.push({ type: "rect", x: px, y: py, width: r, height: SYMBOL_PX, fill: theme.ink });
          } else if (ind.sex === "F") {
            children.push({ type: "path", d: `M ${px + r} ${py} A ${r} ${r} 0 0 0 ${px + r} ${py + SYMBOL_PX} Z`, fill: theme.ink });
          } else {
            children.push({ type: "path", d: `M ${px + r} ${py} L ${px} ${py + r} L ${px + r} ${py + SYMBOL_PX} Z`, fill: theme.ink });
          }
        }

        if (xlinked && !affected) {
          children.push({ type: "circle", cx: px + r, cy: py + r, r: 3.5, fill: theme.ink });
        }

        if (unknownStatus) {
          children.push({ type: "text", x: px + r, y: py + r + 3, text: "?", anchor: "middle", fontSize: 10 });
        }

        if (ind.isDeceased || ind.isSb) {
          children.push({ type: "line", x1: px + SYMBOL_PX + 2, y1: py - 2, x2: px - 2, y2: py + SYMBOL_PX + 2 });
        }

        if (ind.isSb) {
          children.push({ type: "text", x: px + r, y: py + SYMBOL_PX + 22, text: "SB", anchor: "middle", fontSize: 9 });
        }

        if (ind.adopted) {
          const bLeft = px - 6;
          const bRight = px + SYMBOL_PX + 6;
          children.push({ type: "path", d: `M ${bLeft + 3} ${py} L ${bLeft} ${py} L ${bLeft} ${py + SYMBOL_PX} L ${bLeft + 3} ${py + SYMBOL_PX}`, fill: "none", stroke: strokeColor });
          children.push({ type: "path", d: `M ${bRight - 3} ${py} L ${bRight} ${py} L ${bRight} ${py + SYMBOL_PX} L ${bRight - 3} ${py + SYMBOL_PX}`, fill: "none", stroke: strokeColor });
        }

        if (ind.isIndex) {
          const ax = px - 12;
          const ay = py + SYMBOL_PX + 12;
          const tx = px - 1;
          const ty = py + SYMBOL_PX - 1;
          children.push({ type: "line", x1: ax, y1: ay, x2: tx, y2: ty });
          children.push({ type: "path", d: `M ${tx - 6} ${ty} L ${tx} ${ty} L ${tx} ${ty + 6}`, fill: "none", stroke: strokeColor });
        }

        let currentY = py + SYMBOL_PX + 11;
        if (ind.label) {
          const labelLines = ind.label.split("|");
          for (const lineText of labelLines) {
            children.push({ type: "text", x: px + r, y: currentY, text: lineText, anchor: "middle", fontSize: 9 });
            currentY += 11;
          }
        }

        if (ind.age) {
          children.push({ type: "text", x: px + r, y: currentY, text: ind.age, anchor: "middle", fontSize: 9 });
        }

        return { type: "group", x: 0, y: 0, children };
      }

      for (const [id, ind] of diagram.individuals) {
        const p = pos.get(id);
        nodes.push(renderSymbol(ind, p.x, p.y));
      }

      const generations = Array.from(new Set(row.values())).sort((a, b) => a - b);

      const roman = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
      for (let idx = 0; idx < generations.length; idx++) {
        const genY = (rowY.get(generations[idx]) ?? MARGIN_Y) + SYMBOL_PX / 2;
        nodes.push({ type: "text", x: 20, y: genY + 3, text: roman[generations[idx]] || (generations[idx] + 1).toString(), anchor: "start", fontSize: 12 });
      }
      for (const rel of diagram.relationships) {
        const a = pos.get(rel.parent1);
        const b = pos.get(rel.parent2);
        if (!a || !b) continue;
        const [left, right] = a.x <= b.x ? [a, b] : [b, a];
        const marriageY = left.y + SYMBOL_PX / 2;

        if (rel.op === "=") {
          nodes.push({ type: "line", x1: left.x + SYMBOL_PX, y1: marriageY - 2, x2: right.x, y2: marriageY - 2 });
          nodes.push({ type: "line", x1: left.x + SYMBOL_PX, y1: marriageY + 2, x2: right.x, y2: marriageY + 2 });
        } else {
          nodes.push({ type: "line", x1: left.x + SYMBOL_PX, y1: marriageY, x2: right.x, y2: marriageY });
          const midX = (left.x + SYMBOL_PX + right.x) / 2;
          if (rel.op === "/") {
            nodes.push({ type: "line", x1: midX - 4, y1: marriageY + 5, x2: midX, y2: marriageY - 5 });
            nodes.push({ type: "line", x1: midX, y1: marriageY + 5, x2: midX + 4, y2: marriageY - 5 });
          } else if (rel.op === "|") {
            nodes.push({ type: "line", x1: midX - 2, y1: marriageY + 5, x2: midX + 2, y2: marriageY - 5 });
          }
        }

        const midX = (left.x + SYMBOL_PX + right.x) / 2;
        if (rel.isChildless) {
          const dropY = marriageY + 15;
          nodes.push({ type: "line", x1: midX, y1: marriageY, x2: midX, y2: dropY });
          nodes.push({ type: "line", x1: midX - 6, y1: dropY, x2: midX + 6, y2: dropY });
          if (rel.isInfertile) {
            nodes.push({ type: "line", x1: midX - 6, y1: dropY + 3, x2: midX + 6, y2: dropY + 3 });
          }
          continue;
        }

        const parentRow = row.get(rel.parent1) ?? 0;
        const childRowY = rowY.get(parentRow + 1) ?? (left.y + 90);
        const barY = childRowY - 25;
        const childDrops = [];

        for (const group of rel.children) {
          if (group.type === "single") {
            const k = pos.get(group.name);
            if (!k) continue;
            const ind = diagram.individuals.get(group.name);
            const dash = ind?.adopted === "out" ? "4" : undefined;
            childDrops.push({ cx: k.x + SYMBOL_PX / 2, cy: k.y, isTwin: false, strokeDash: dash });
          } else {
            const twinCenters = group.children.map(name => {
              const k = pos.get(name);
              return k ? k.x + SYMBOL_PX / 2 : 0;
            });
            const twinMidX = (Math.min(...twinCenters) + Math.max(...twinCenters)) / 2;

            for (let i = 0; i < group.children.length; i++) {
              const name = group.children[i];
              const k = pos.get(name);
              if (!k) continue;
              const ind = diagram.individuals.get(name);
              const dash = ind?.adopted === "out" ? "4" : undefined;

              nodes.push({ type: "line", x1: twinMidX, y1: barY, x2: k.x + SYMBOL_PX / 2, y2: k.y, strokeDash: dash });
            }

            if (group.type === "monozygotic" && group.children.length >= 2) {
              const k1 = pos.get(group.children[0]);
              const k2 = pos.get(group.children[1]);
              if (k1 && k2) {
                const halfX1 = (twinMidX + k1.x + SYMBOL_PX / 2) / 2;
                const halfX2 = (twinMidX + k2.x + SYMBOL_PX / 2) / 2;
                const halfY = (barY + k1.y) / 2;
                nodes.push({ type: "line", x1: halfX1, y1: halfY, x2: halfX2, y2: halfY });
              }
            }
            childDrops.push({ cx: twinMidX, cy: barY, isTwin: true });
          }
        }

        nodes.push({ type: "line", x1: midX, y1: marriageY, x2: midX, y2: barY });
        const dropXs = childDrops.map(d => d.cx);
        const minDropX = Math.min(midX, ...dropXs);
        const maxDropX = Math.max(midX, ...dropXs);
        nodes.push({ type: "line", x1: minDropX, y1: barY, x2: maxDropX, y2: barY });

        for (const drop of childDrops) {
          if (!drop.isTwin) {
            nodes.push({ type: "line", x1: drop.cx, y1: barY, x2: drop.cx, y2: drop.cy, strokeDash: drop.strokeDash });
          }
        }
      }

      let legendY = (rowY.get(generations.length) ?? (rowY.get(generations.length - 1) + 100)) + 20;
      if (diagram.legends.length > 0) {
        nodes.push({ type: "line", x1: MARGIN_X, y1: legendY, x2: canvasWidth - MARGIN_X, y2: legendY });
        legendY += 15;
        let lx = MARGIN_X;
        for (const leg of diagram.legends) {
          if (leg.status === "XCa") {
            nodes.push({ type: "circle", cx: lx + 6, cy: legendY + 6, r: 6, fill: theme.surface, stroke: theme.ink });
            nodes.push({ type: "circle", cx: lx + 6, cy: legendY + 6, r: 2, fill: theme.ink, stroke: "none" });
          } else {
            const indicatorFill = leg.status === "Af" ? theme.ink : theme.surface;
            nodes.push({ type: "rect", x: lx, y: legendY, width: 12, height: 12, fill: indicatorFill, stroke: theme.ink });

            if (leg.status === "Ca") {
              nodes.push({ type: "rect", x: lx, y: legendY, width: 6, height: 12, fill: theme.ink });
            }
            if (leg.status === "Unk") {
              nodes.push({ type: "text", x: lx + 6, y: legendY + 9, text: "?", anchor: "middle", fontSize: 8 });
            }
          }
          nodes.push({ type: "text", x: lx + 18, y: legendY + 10, text: leg.description, anchor: "start", fontSize: 9 });
          lx += 150;
          if (lx > canvasWidth - 100) {
            lx = MARGIN_X;
            legendY += 20;
          }
        }
        legendY += 20;
      }

      return { width: canvasWidth, height: legendY + MARGIN_Y, nodes };
    }

    function renderNode(node) {
      switch (node.type) {
        case "line": {
          const dash = node.strokeDash ? ` stroke-dasharray="${node.strokeDash}"` : "";
          return `<line x1="${node.x1}" x2="${node.x2}" y1="${node.y1}" y2="${node.y2}" stroke="${theme.ink}" stroke-width="1.5"${dash} />`;
        }
        case "rect":
          return `<rect x="${node.x}" y="${node.y}" width="${node.width}" height="${node.height}" fill="${node.fill ?? theme.surface}" stroke="${node.stroke ?? theme.ink}" stroke-width="1.5" />`;
        case "text":
          return `<text x="${node.x}" y="${node.y}" text-anchor="${node.anchor ?? "start"}" alignment-baseline="${node.baseline ?? "alphabetic"}" font-family="system-ui, sans-serif" font-size="${node.fontSize ?? 10}" fill="${node.color ?? theme.text}">${node.text}</text>`;
        case "circle":
          return `<circle cx="${node.cx}" cy="${node.cy}" r="${node.r}" fill="${node.fill ?? theme.surface}" stroke="${node.stroke ?? theme.ink}" stroke-width="1.5" />`;
        case "path":
          return `<path d="${node.d}" fill="${node.fill ?? "none"}" stroke="${node.stroke ?? theme.ink}" stroke-width="1.5" />`;
        case "group":
          return `<g transform="translate(${node.x},${node.y})">${node.children.map(renderNode).join("")}</g>`;
        default:
          return "";
      }
    }

    function renderSVG(layout) {
      return `<svg viewBox="0 0 ${layout.width} ${layout.height}" width="100%" style="max-width:${layout.width}px; background-color:${theme.surface};" xmlns="http://www.w3.org/2000/svg">${layout.nodes.map(renderNode).join("")}</svg>`;
    }

    function renderPedigree(dsl) {
      const diagram = parseDSL(dsl);
      const layout = layoutDiagram(diagram);
      return renderSVG(layout);
    }

    // --- Playground Wiring ---
    const editor = document.getElementById("editor");
    const renderBtn = document.getElementById("renderBtn");
    const templateSelect = document.getElementById("templateSelect");
    const svgContainer = document.getElementById("svgContainer");
    const errorBanner = document.getElementById("errorBanner");

    const templates = {
      simple: `% Simple 3-generation family pedigree
I1 M UAf 72 [label:Arthur]
I2 F UAf 70 [label:Beatrice]
II1 M Af 45 [label:Charles|Dengue]
II2 F UAf 43 [label:Diana]
III1 F UAf 12 [label:Emily]
III2 M Af 9 [label:Fred]

~ I1-I2 > II1
~ II1-II2 > III1,III2
`,
      consanguineous: `% Consanguineous union with twin offspring
! Af Affected Syndrome
! Ca Carrier Status

Grandpa M UAf 78
Grandma F UAf 76
Father M Ca 52
Mother F Ca 48
Son M Af 20 index
TwinA F UAf 15
TwinB F UAf 15

~ Grandpa-Grandma > Father,Mother
% Consanguineous relationship (= operator)
~ Father = Mother > Son,[TwinA,TwinB]
`,
      complex: `% Complex Pedigree with Dead, Pregnancy, Miscarriage, stillbirth, and Adoption
! Af Breast Cancer
! XCa BRCA2 Carrier

I1 M UAf dead 80
I2 F Af dead 78
II1 M Af 50
II2 F XCa 48
II3 F UAf dead sb
II4 F UAf preg
III1 M UAf 22 adopted-in
III2 F Af 18
III3 U UAf misc

~ I1-I2 > II2,II3,II4
~ II1-II2 > III1,III2,III3
`,
      childless: `% Childless and Infertility indicators
Alice F Af 32
Tom M UAf 34
Sarah F UAf 38
Bob M UAf 40

% Childless by choice (no right side)
~ Alice-Tom >
% Childless due to infertility (* operator)
~ Sarah-Bob > *
`
    };

    function triggerRender() {
      const code = editor.value;
      try {
        errorBanner.style.display = "none";
        const svgString = renderPedigree(code);
        svgContainer.innerHTML = svgString;
      } catch (err) {
        errorBanner.textContent = err.message;
        errorBanner.style.display = "block";
      }
    }

    templateSelect.addEventListener("change", (e) => {
      editor.value = templates[e.target.value];
      triggerRender();
    });

    renderBtn.addEventListener("click", triggerRender);

    // Initial load
    editor.value = templates.simple;
    triggerRender();
  </script>
</body>
</html>
